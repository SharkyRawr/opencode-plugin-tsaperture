name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install OpenCode v2
        run: |
          mkdir -p "$RUNNER_TEMP/opencode-v2"
          pnpm --dir "$RUNNER_TEMP/opencode-v2" add --allow-build=@opencode/cli @opencode/cli@2.0.29

      - name: Run tests
        env:
          OPENCODE_V2_BIN: ${{ runner.temp }}/opencode-v2/node_modules/.bin/opencode2
        run: pnpm test
